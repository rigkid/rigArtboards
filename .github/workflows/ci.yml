name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  PACK: rigArtboards

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::warning::No RIGKIT_CI_TOKEN - private host/pack clones may fail."
          fi

      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout RigKit host
        uses: actions/checkout@v4
        with:
          repository: rigkid/RigKit
          path: host
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN || github.token }}

      - name: Overlay pack under test
        run: |
          rm -rf "host/packs/${PACK}"
          mkdir -p host/packs
          cp -a pack "host/packs/${PACK}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure pack smoke
        working-directory: host
        run: >
          cmake -S "packs/${PACK}"
          -B "packs/${PACK}/build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRIGKIT_ROOT="${{ github.workspace }}/host"

      - name: Build surface_smoke
        working-directory: host
        run: cmake --build "packs/${PACK}/build" --target surface_smoke

      - name: Run surface_smoke
        working-directory: host
        run: "./packs/${PACK}/build/surface_smoke"
